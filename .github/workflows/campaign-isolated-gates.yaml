name: Campaign isolated contribution gates
on:
  push:
    branches: [audit/campaign-gates-20260922]
permissions:
  contents: read
jobs:
  validation:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - label: graph-docs-set-pull-identity
            ref: ab093cb7858096a44f827385f97e3df5f2919149
          - label: cli-preserve-malformed-config
            ref: e7b2026f7f3f2557db95e96f0f191238578117af
          - label: cli-hermes-hook-path-quoting
            ref: a8c3f00634bc8576f6a86dd84acbb87415587919
          - label: cli-install-failure-status
            ref: 2bbf0d70cac410de8698d01ef769c7e796be57e4
          - label: cli-pi-legacy-skill-ownership
            ref: 8219a5410d49bfb8e64b86824321dbc4af1d39e7
          - label: skillify-pick-global-quota
            ref: 1f3d9fe6354e96b417811660cf7a168fe57d0434
          - label: skillify-local-manifest-atomic
            ref: 660b21ee79fbe87cfb91876010d11013d1bc2280
          - label: skillify-autopull-cancellation
            ref: aa16ece550062ef4907d0e27d8e5824b5928afb3
          - label: skillify-rmw-lock-bounded
            ref: fa0cb09bfcba8647d0695b5e6501026c628075ce
          - label: skillify-pull-manifest-repair
            ref: bf0a02c8af9d44e07289f2edefd24309134b46cd
          - label: runtime-table-fetch-deadline
            ref: 69aa5b96ddf6e5726e405df728a52992e42a0009
          - label: runtime-notification-drain-race
            ref: 3cfa06390dc9b0cf57600b119ed0b9f053b77e26
          - label: private-doc-owner-access
            ref: 65bb4cf37c9190a84084a77f7637672d1411a324
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
      - name: Install exact lockfile dependencies
        env:
          HUSKY: '0'
        run: |
          mkdir -p /tmp/campaign-gate
          npm ci > /tmp/campaign-gate/install.log 2>&1 || { tail -100 /tmp/campaign-gate/install.log; exit 1; }
      - name: Typecheck build duplication and bundle audit
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee /tmp/campaign-gate/commit.txt
          git diff ce30de7ca94115cb73fa991538c6d2595ac2622a...HEAD --check
          npm run typecheck > /tmp/campaign-gate/typecheck.log 2>&1 || { cat /tmp/campaign-gate/typecheck.log; exit 1; }
          npm run build > /tmp/campaign-gate/build.log 2>&1 || { tail -100 /tmp/campaign-gate/build.log; exit 1; }
          npm run dup > /tmp/campaign-gate/duplication.log 2>&1 || { tail -100 /tmp/campaign-gate/duplication.log; exit 1; }
          npm run audit:openclaw -- --criticals-only > /tmp/campaign-gate/bundle-audit.log 2>&1 || { cat /tmp/campaign-gate/bundle-audit.log; exit 1; }
      - name: Full repository tests with coverage
        run: |
          npx vitest run --coverage --maxWorkers=2 --reporter=default --reporter=json --outputFile=/tmp/campaign-gate/tests.json > /tmp/campaign-gate/tests.log 2>&1 || { tail -150 /tmp/campaign-gate/tests.log; exit 1; }
          python3 - <<'PYCODE'
          import json
          r=json.load(open('/tmp/campaign-gate/tests.json'))
          print({k:r[k] for k in ['numTotalTests','numPassedTests','numFailedTests','numPendingTests','success']})
          assert r['success'] is True
          assert r['numFailedTests']==0
          assert r['numPendingTests']==0
          assert r['numPassedTests']>=5849
          PYCODE
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: campaign-${{ matrix.label }}
          path: /tmp/campaign-gate/
          retention-days: 7
