name: Contribution audit validation

on:
  push:
    branches: [audit/validation-20260922]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'
      - name: Build baseline
        run: npm run build
      - name: Archive test dependencies and emitted bundles
        run: |
          du -sh node_modules
          python3 - <<'PY'
          import pathlib, subprocess
          roots = [pathlib.Path('node_modules'), pathlib.Path('bundle'), pathlib.Path('dist')]
          roots += list(pathlib.Path('harnesses').glob('*/bundle'))
          roots += list(pathlib.Path('harnesses').glob('*/dist'))
          roots += [pathlib.Path('mcp/bundle')]
          args = ['tar', '-czf', '/tmp/hivemind-audit-runtime.tar.gz']
          args += [str(p) for p in roots if p.exists()]
          subprocess.run(args, check=True)
          PY
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: hivemind-audit-runtime
          path: /tmp/hivemind-audit-runtime.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Run baseline tests
        run: npx vitest run --coverage
