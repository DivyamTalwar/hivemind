name: Independent next contribution gates
on:
  push:
    branches: [audit/next-fix-gates-20260924]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - label: trunk-branch
            branch: fix/docs-preserve-nested-default-branch
            title: 'fix(docs): preserve slash-containing default branch names'
            regression: tests/shared/docs-nested-trunk.test.ts
            failures: 3
          - label: git-filenames
            branch: fix/docs-preserve-literal-git-filenames
            title: 'fix(docs): preserve literal filenames in refresh candidates'
            regression: tests/shared/docs-candidate-filenames.test.ts
            failures: 1
          - label: hooks-path
            branch: fix/graph-expand-home-relative-hooks-path
            title: 'fix(graph): honor home-relative Git hook directories'
            regression: tests/shared/graph/git-hook-expanded-path.test.ts
            failures: 1
          - label: graph-cache
            branch: fix/graph-cache-relocated-call-metadata
            title: 'fix(graph): preserve cross-file calls when relocating cached files'
            regression: tests/shared/graph/cache-call-metadata.test.ts
            failures: 2
    name: ${{ matrix.label }}
    env:
      BASE: ce30de7ca94115cb73fa991538c6d2595ac2622a
      LABEL: ${{ matrix.label }}
      BRANCH: ${{ matrix.branch }}
      TITLE: ${{ matrix.title }}
      REGRESSION: ${{ matrix.regression }}
      EXPECTED_FAILURES: ${{ matrix.failures }}
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
      - name: Apply reviewed patch on unchanged upstream
        run: |
          set -euo pipefail
          mkdir -p /tmp/next-gate
          cp ".contribution-audit/$LABEL.patch" /tmp/next-gate/change.patch
          git switch --detach "$BASE"
          git apply --check /tmp/next-gate/change.patch
          git apply /tmp/next-gate/change.patch
          git add -- src tests
          git config user.name 'Divyam Talwar'
          git config user.email '194859478+DivyamTalwar@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m "$TITLE"
          git rev-parse HEAD | tee /tmp/next-gate/commit.txt
          git diff "$BASE"...HEAD --check
          git diff "$BASE"...HEAD --name-only | tee /tmp/next-gate/changed-files.txt
          ! grep -Ev '^(src/|tests/)' /tmp/next-gate/changed-files.txt
      - name: Install build and static checks
        run: |
          set -euo pipefail
          npm ci > /tmp/next-gate/install.log 2>&1 || { tail -100 /tmp/next-gate/install.log; exit 1; }
          npm run typecheck > /tmp/next-gate/typecheck.log 2>&1 || { cat /tmp/next-gate/typecheck.log; exit 1; }
          npm run build > /tmp/next-gate/build.log 2>&1 || { tail -100 /tmp/next-gate/build.log; exit 1; }
          npm run dup > /tmp/next-gate/dup.log 2>&1 || { tail -100 /tmp/next-gate/dup.log; exit 1; }
          npm run audit:openclaw -- --criticals-only > /tmp/next-gate/bundle.log 2>&1 || { cat /tmp/next-gate/bundle.log; exit 1; }
      - name: Full native suite with coverage
        run: |
          set -euo pipefail
          npx vitest run --coverage --maxWorkers=2 --reporter=json --outputFile=/tmp/next-gate/full.json > /tmp/next-gate/full.log 2>&1 || { tail -150 /tmp/next-gate/full.log; exit 1; }
          node -e 'const r=require("/tmp/next-gate/full.json");console.log({total:r.numTotalTests,passed:r.numPassedTests,failed:r.numFailedTests,skipped:r.numPendingTests});if(!r.success||r.numFailedTests||r.numPendingTests)process.exit(1)'
      - name: Prove unchanged production fails the new regression
        run: |
          set -euo pipefail
          git restore --source="$BASE" --worktree -- src
          set +e
          npx vitest run "$REGRESSION" --maxWorkers=1 --reporter=json --outputFile=/tmp/next-gate/before.json > /tmp/next-gate/before.log 2>&1
          result=$?
          set -e
          test "$result" -eq 1
          node -e 'const r=require("/tmp/next-gate/before.json");console.log({passed:r.numPassedTests,failed:r.numFailedTests,skipped:r.numPendingTests});if(r.numFailedTests!==Number(process.env.EXPECTED_FAILURES)||r.numPendingTests)process.exit(1)'
          git restore --source=HEAD --worktree -- src
          git diff --exit-code
      - name: Publish tested fork branch without rewriting existing history
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo 'Branch already exists; refusing to overwrite it.'
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          printf '%s\n' "$BRANCH" > /tmp/next-gate/branch.txt
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: next-${{ matrix.label }}
          path: /tmp/next-gate/
          retention-days: 7
